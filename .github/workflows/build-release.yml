name: Build Release APK

on:
  push:
    tags:
      - 'v*.*.*'             # Trigger on version tags: v1.0.0, v1.2.3, etc.
  workflow_dispatch:         # Also allow manual trigger
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      create_release:
        description: 'Create GitHub Release?'
        required: true
        type: boolean
        default: true

jobs:
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Only run on your own repo — safety guard
    if: github.repository_owner == github.actor || github.event_name == 'push'

    steps:

      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       # Full history for changelog generation

      # ── 2. Determine version ─────────────────────────────────────────────────
      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            # Strip 'v' prefix from tag: v1.0.0 → 1.0.0
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.version_name }}"
          fi
          echo "name=$VERSION" >> $GITHUB_OUTPUT
          # Convert to versionCode: 1.0.0 → 10000, 1.2.3 → 10203
          IFS='.' read -r major minor patch <<< "$VERSION"
          CODE=$((major * 10000 + minor * 100 + patch))
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "Version: $VERSION (code: $CODE)"

      # ── 3. Java 17 ───────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 4. Gradle cache ──────────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant Gradle execute permission
        run: chmod +x ./gradlew

      # ── 5. Decode keystore from GitHub Secret ────────────────────────────────
      # Secret KEYSTORE_BASE64 = base64 of your .jks file
      # Generate keystore: see GITHUB_SETUP.md
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release-keystore.jks
          echo "Keystore decoded ✓"

      # ── 6. Build signed Release APK ──────────────────────────────────────────
      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}" \
            --stacktrace \
            --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
          SIGNING_STORE_FILE: "release-keystore.jks"
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      # ── 7. Rename APK to include version ─────────────────────────────────────
      - name: Rename APK
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk \
             release-output/360-Launcher-v${{ steps.version.outputs.name }}.apk
          ls -lh release-output/

      # ── 8. Upload as artifact ─────────────────────────────────────────────────
      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 360-Launcher-v${{ steps.version.outputs.name }}
          path: release-output/360-Launcher-v${{ steps.version.outputs.name }}.apk
          retention-days: 90
          if-no-files-found: error

      # ── 9. Generate changelog from git log ───────────────────────────────────
      - name: Generate changelog
        id: changelog
        run: |
          # Get commits since last tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --oneline -20 --pretty="- %s")
          else
            LOG=$(git log ${PREV_TAG}..HEAD --oneline --pretty="- %s")
          fi
          # Escape multiline for GitHub output
          echo "log<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # ── 10. Create GitHub Release ─────────────────────────────────────────────
      - name: Create GitHub Release
        if: |
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: "360 Launcher v${{ steps.version.outputs.name }}"
          body: |
            ## 360 Launcher v${{ steps.version.outputs.name }}
            **Build:** #${{ github.run_number }}
            **Date:** ${{ github.event.repository.updated_at }}

            ### Install
            1. Download `360-Launcher-v${{ steps.version.outputs.name }}.apk`
            2. Transfer to Poco F6
            3. `adb install -r 360-Launcher-v${{ steps.version.outputs.name }}.apk`
               or enable "Install from unknown sources" and open the APK

            ### Changes
            ${{ steps.changelog.outputs.log }}

          files: release-output/360-Launcher-v${{ steps.version.outputs.name }}.apk
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 11. Cleanup sensitive files ───────────────────────────────────────────
      - name: Remove keystore
        if: always()   # Run even if build fails
        run: |
          rm -f app/release-keystore.jks
          echo "Keystore removed ✓"
